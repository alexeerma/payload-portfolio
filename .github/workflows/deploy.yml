name: Deploy to Zone.ee

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package
        env:
          NEXT_PUBLIC_SERVER_URL: https://alexeerma.ee
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          SMTP_HOST: smtp.zone.eu
        run: bash scripts/build-deploy.sh

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload to server
        run: |
          # Recreate .env from secrets on every deploy, so it can never be lost on the server.
          printf 'DATABASE_URL=file:/data05/virt114532/domeenid/www.alexeerma.ee/htdocs/payload-portfolio.db\nPAYLOAD_SECRET=%s\nNEXT_PUBLIC_SERVER_URL=https://alexeerma.ee\nSMTP_HOST=smtp.zone.eu\n' '${{ secrets.PAYLOAD_SECRET }}' > runtime.env
          rsync -vrm -e "ssh -o StrictHostKeyChecking=no" deploy.tar.gz ${{ secrets.SSH_LOGIN_CREDS }}:/data05/virt114532/domeenid/www.alexeerma.ee/htdocs/
          rsync -vm -e "ssh -o StrictHostKeyChecking=no" runtime.env ${{ secrets.SSH_LOGIN_CREDS }}:/data05/virt114532/domeenid/www.alexeerma.ee/htdocs/.env

      - name: Stop app
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_LOGIN_CREDS }} "pm2 stop payload-portfolio || true"

      - name: Migrate database
        env:
          DATABASE_URL: file:./prod.db
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          # Pull the live db down, migrate it with this commit's migrations, push it back.
          # The server never runs `payload migrate` itself, so this is the only place
          # schema changes get applied — skipping it leaves code and db out of sync.
          scp -o StrictHostKeyChecking=no ${{ secrets.SSH_LOGIN_CREDS }}:/data05/virt114532/domeenid/www.alexeerma.ee/htdocs/payload-portfolio.db ./prod.db || true
          pnpm payload migrate
          scp -o StrictHostKeyChecking=no ./prod.db ${{ secrets.SSH_LOGIN_CREDS }}:/data05/virt114532/domeenid/www.alexeerma.ee/htdocs/payload-portfolio.db

      - name: Extract and restart
        run: |
          # node_modules and .next are fully contained in the archive; remove them first
          # because tar cannot extract directories over pnpm's existing symlinks.
          # Plain tar after that: dirs merge, files overwrite, nothing else is deleted.
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_LOGIN_CREDS }} "cd /data05/virt114532/domeenid/www.alexeerma.ee/htdocs && rm -rf node_modules .next && tar -xzf deploy.tar.gz -C . && (pm2 restart payload-portfolio --update-env || pm2 start pm2.config.js)"
